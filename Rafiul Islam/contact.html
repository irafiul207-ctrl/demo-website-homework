<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RafiSpace.Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #bdceec;
            color: #222;
        }

        /* NAVBAR */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: #754ce6;
            color: white;
            padding: 15px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        header h1 {
            font-size: 22px;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #9bc3d4;
        }

        .login-btn {
            margin-left: 30px;
            padding: 8px 18px;
            background: #ffffff;
            color: #754ce6;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #0f172a;
            color: white;
        }

        main {
            padding-top: 70px;
        }

        /* HERO */
        .hero {
            background: linear-gradient(to right, #1e293b, #0f172a);
            color: white;
            padding: 80px 60px;
            text-align: center;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 16px;
            opacity: 0.9;
            max-width: 700px;
            margin: auto;
        }

        /* CONTACT FORM */
        .contact-section {
            max-width: 700px;
            margin: 40px auto;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .contact-section h3 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #2e65e7;
            text-align: center;
        }

        .contact-section input,
        .contact-section textarea {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 15px;
        }

        .contact-section button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .contact-section button:hover {
            background: #1e40af;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #754ce6;
            color: white;
            text-align: center;
            padding: 12px;
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }

            .hero {
                padding: 60px 20px;
            }

            .contact-section {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <h1>RafiSpace</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="service.html">Services</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" class="login-btn">Login</a>
        </nav>
    </header>

    <main>

        <!-- HERO SECTION -->
        <div class="hero">
            <h2>Contact Us</h2>
            <p>
                Have questions or want to collaborate? Fill out the form below and we will get back to you as soon as
                possible.
            </p>
        </div>

        <!-- CONTACT FORM SECTION -->
        <section class="contact-section">
            <h3>Send Us a Message</h3>
            <form action="#" method="POST">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required="@gmail">
                <input type="text" name="subject" placeholder="Subject" required>
                <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 RafiSpace — All Rights Reserved
    </footer>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
