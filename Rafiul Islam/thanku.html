<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Thank You | RafiSpace</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
        }

        .thankyou-box {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .thankyou-box h2 {
            color: #2e65e7;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .thankyou-box p {
            font-size: 16px;
            color: #333;
            margin-bottom: 30px;
        }

        .thankyou-box a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #2e65e7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            transition: background-color 0.3s;
        }

        .thankyou-box a:hover {
            background-color: #1e40af;
        }

        @media (max-width: 500px) {
            .thankyou-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="thankyou-box">
        <h2>Thank You!</h2>
        <p>Your account has been successfully created.</p>
        <a href="login.html">Go to Login</a>
    </div>

</body>

</html>
